    <meta property="og:title" content="Juragankambing.id - 085211885000 | Katering, Aqiqah & Qurban Tangerang Selatan" />
    <meta property="og:description" content="Lengkap, lezat, dan mudah dipesan untuk setiap momen." />
    <meta property="og:type" content="website" />
    <title>Juragankambing.id - 085211885000 | Katering, Aqiqah & Qurban Tangerang Selatan</title>
    <link rel="icon" type="image/webp" href="%BASE_URL%image/juragankambing-logo-transparent.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (() => {
        const isManus = location.hostname.endsWith('.manus.space') || location.hostname.endsWith('.manus.computer') || location.hostname === 'localhost';
        const root = isManus ? '/manus-storage/' : '%BASE_URL%image/';
        const mobile = `${root}${isManus ? 'juragankambing-hero-mobile_9dea06c1.webp' : 'juragankambing-hero-mobile.webp'}`;
        const desktop = `${root}${isManus ? 'juragankambing-hero-manus-optimized_cedec82a.webp' : 'juragankambing-hero.webp'}`;
        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = desktop;
        preload.setAttribute('imagesrcset', `${mobile} 768w, ${desktop} 1600w`);
        preload.setAttribute('imagesizes', '(max-width: 640px) 100vw, (max-width: 1024px) 80vw, 55vw');
        document.head.appendChild(preload);
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const loadAnalytics = () => {
          const endpoint = "%VITE_ANALYTICS_ENDPOINT%";
          const websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
          if (!endpoint || endpoint.includes("%VITE_") || !websiteId || websiteId.includes("%VITE_")) return;
          const script = document.createElement("script");
          script.defer = true;
          script.src = `${endpoint.replace(/\/$/, "")}/umami`;
          script.dataset.websiteId = websiteId;
          document.head.appendChild(script);
        };
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(loadAnalytics, { timeout: 2500 });
        } else {
          window.addEventListener("load", () => window.setTimeout(loadAnalytics, 1200), { once: true });
        }
      })();
    </script>
  </body>
</html>
